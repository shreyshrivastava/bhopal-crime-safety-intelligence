name: Refresh official data

on:
  schedule:
    # 00:00 IST (18:30 UTC on the preceding day).
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-official-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check official source and refresh reviewed records
        run: python scripts/scheduled_refresh.py
      - name: Validate source and failure handling
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Export updated dashboard
        run: python scripts/export_official_html.py
      - name: Publish verified snapshot
        run: |
          git add data/official/publications.json data/official/updates.json index.html
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh verified official source snapshot [skip ci]'
          git push origin HEAD:main
